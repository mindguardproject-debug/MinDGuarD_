<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "ТУТ_API_KEY",
    authDomain: "ТУТ_DOMAIN",
    projectId: "ТУТ_PROJECT_ID",
    storageBucket: "ТУТ_BUCKET",
    messagingSenderId: "ТУТ_SENDER_ID",
    appId: "ТУТ_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.getDocs = getDocs;

</script>

<script>

// --- СКРОЛЛ-АНІМАЦІЯ ---
const reveals = document.querySelectorAll('.reveal');

function scanElements() {
    reveals.forEach(el => {
        const windowHeight = window.innerHeight;
        const revealTop = el.getBoundingClientRect().top;

        if (revealTop < windowHeight - 80) {
            el.classList.add('active');
        }
    });
}

window.addEventListener('scroll', scanElements);
window.addEventListener('load', scanElements);

// --- ФОРМИ ---
function toggleForm(formId) {
    const form = document.getElementById(formId);

    form.style.display =
        form.style.display === 'block'
            ? 'none'
            : 'block';
}

// --- СЛАЙДЕРИ ---
function moveSlider(containerId, direction) {

    const container =
        document.getElementById(containerId);

    const firstCard =
        container.querySelector('.card');

    if (!firstCard) return;

    const cardWidth =
        firstCard.getBoundingClientRect().width;

    const gap = 25;

    let step = cardWidth + gap;

    if (window.innerWidth >= 1024) {
        step *= 3;
    }

    else if (window.innerWidth >= 768) {
        step *= 2;
    }

    container.scrollTo({
        left: container.scrollLeft + (step * direction),
        behavior: 'smooth'
    });
}

// --- ЩОДЕННИК НАСТРОЮ ---
let currentSelectedMood = '';

function selectMood(mood, element) {

    document.querySelectorAll('.mood-btn')
        .forEach(btn => btn.classList.remove('selected'));

    element.classList.add('selected');

    currentSelectedMood = mood;

    document.getElementById(
        'mood-input-container'
    ).style.display = 'block';
}

function saveMoodState() {

    const note =
        document.getElementById('mood-text')
        .value
        .trim();

    if (!currentSelectedMood) return;

    const now = new Date();

    const timeString =
        `${String(now.getDate()).padStart(2,'0')}.` +
        `${String(now.getMonth()+1).padStart(2,'0')} ` +
        `${String(now.getHours()).padStart(2,'0')}:` +
        `${String(now.getMinutes()).padStart(2,'0')}`;

    const moodEntry = {
        mood: currentSelectedMood,
        note: note || "Без коментаря",
        time: timeString
    };

    let history =
        JSON.parse(
            localStorage.getItem('mood_history') || '[]'
        );

    history.unshift(moodEntry);

    localStorage.setItem(
        'mood_history',
        JSON.stringify(history)
    );

    renderMoodHistory();

    document.getElementById('mood-text').value = '';

    document.querySelectorAll('.mood-btn')
        .forEach(btn => btn.classList.remove('selected'));

    document.getElementById(
        'mood-input-container'
    ).style.display = 'none';

    currentSelectedMood = '';
}

function renderMoodHistory() {

    const container =
        document.getElementById('history-list');

    const history =
        JSON.parse(
            localStorage.getItem('mood_history') || '[]'
        );

    if (history.length === 0) {

        container.innerHTML = `
            <p style="
                font-size:0.8rem;
                color:#94a3b8;
                text-align:center;
            ">
                Тут будуть ваші записи
            </p>
        `;

        return;
    }

    container.innerHTML =
        history.map(item => `
            <div class="history-item">
                <strong>
                    Почувався: ${item.mood}
                </strong>
                — ${item.note}

                <span class="time">
                    ${item.time}
                </span>
            </div>
        `).join('');
}

// --- SUPPORT ---
function sendSupportMessage() {

    const emailInput =
        document.getElementById('s-email');

    const messageInput =
        document.getElementById('s-message');

    const submitBtn =
        document.getElementById('support-submit-btn');

    const successMsg =
        document.getElementById('support-success');

    const email =
        emailInput.value.trim();

    const message =
        messageInput.value.trim();

    if (!email || !message) {

        alert("Заповніть всі поля!");

        return;
    }

    if (
        !email.includes('@') ||
        !email.includes('.')
    ) {

        alert("Введіть правильний Email!");

        return;
    }

    submitBtn.innerText = "Надсилання...";
    submitBtn.disabled = true;

    setTimeout(() => {

        emailInput.value = '';
        messageInput.value = '';

        successMsg.style.display = 'block';

        submitBtn.innerText = "Надіслати запит";
        submitBtn.disabled = false;

        setTimeout(() => {
            successMsg.style.display = 'none';
        }, 7000);

    }, 1200);
}

// --- ВІДЕО ---
async function submitVideo() {

    const url =
        document.getElementById('v-url')
        .value.trim();

    const title =
        document.getElementById('v-title')
        .value.trim();

    const desc =
        document.getElementById('v-desc')
        .value.trim();

    if (!url || !title || !desc) {

        alert("Заповніть усі поля!");

        return;
    }

    const video = { url, title, desc };

    await addDoc(
        collection(db, "videos"),
        video
    );

    appendVideoCard(video);

    document.getElementById('v-url').value = '';
    document.getElementById('v-title').value = '';
    document.getElementById('v-desc').value = '';

    toggleForm('video-form');
}

function appendVideoCard(video) {

    const container =
        document.getElementById('videos-container');

    const isFb =
        video.url.includes('facebook.com') ||
        video.url.includes('fb.watch');

    let mediaContent = '';
    let sourceName = '';
    let iconLetter = '';
    let iconBg = '';

    // FACEBOOK
    if (isFb) {

        sourceName = 'Facebook';
        iconLetter = 'f';
        iconBg = '#4267B2';

        mediaContent = `
            <a href="${video.url}"
               target="_blank"
               class="btn">
               Дивитися на Facebook
            </a>
        `;
    }

    // YOUTUBE
    else {

        sourceName = 'YouTube';
        iconLetter = '▶';
        iconBg = '#FF0000';

        let youtubeId = '';

        if (video.url.includes('watch?v=')) {

            youtubeId =
                video.url
                .split('v=')[1]
                .split('&')[0];
        }

        else if (
            video.url.includes('youtu.be/')
        ) {

            youtubeId =
                video.url
                .split('youtu.be/')[1]
                .split('?')[0];
        }

        mediaContent = `
            <div style="margin-top:15px;">

                <iframe
                    width="100%"
                    height="220"
                    src="https://www.youtube.com/embed/${youtubeId}"
                    title="YouTube video player"
                    frameborder="0"
                    allowfullscreen
                    style="border-radius:18px;">
                </iframe>

            </div>
        `;
    }

    const cardHtml = `
        <div class="card">

            <div class="icon"
                 style="
                    background:${iconBg};
                    color:white;
                 ">
                ${iconLetter}
            </div>

            <h3>${video.title}</h3>

            <p>${video.desc}</p>

            <p style="
                margin-top:15px;
                font-size:0.8rem;
                color:#667085;
                line-height:1.4;
            ">
                <strong>Джерело:</strong>
                ${sourceName}<br>

                <strong>Автор відео:</strong>
                Безбар'єрність<br>

                <small>
                    <em>
                    *Матеріал використано
                    з освітньою метою.
                    </em>
                </small>
            </p>

            ${mediaContent}

        </div>
    `;

    container.insertAdjacentHTML(
        'beforeend',
        cardHtml
    );
}

// --- ВІДГУКИ ---
async function submitReview() {

    const name =
        document.getElementById('r-name')
        .value.trim();

    const text =
        document.getElementById('r-text')
        .value.trim();

    const ratingActive =
        document.querySelector(
            'input[name="rating"]:checked'
        );

    if (!name || !text || !ratingActive) {

        alert("Заповніть форму!");

        return;
    }

    const rating =
        parseInt(ratingActive.value);

    const now = new Date();

    const review = {
        name,
        text,
        rating,
        date: now.toLocaleDateString('uk-UA')
    };

    await addDoc(
        collection(db, "reviews"),
        review
    );

    appendReviewCard(review);

    document.getElementById('r-name').value = '';
    document.getElementById('r-text').value = '';

    ratingActive.checked = false;

    toggleForm('review-form');
}

function appendReviewCard(review) {

    const container =
        document.getElementById('reviews-container');

    let starsHtml = '';

    for (let i = 1; i <= 5; i++) {

        starsHtml +=
            i <= review.rating
                ? '★'
                : '☆';
    }

    const cardHtml = `
        <div class="card testimonial">

            <div class="avatar"></div>

            <div class="review-stars">
                ${starsHtml}
            </div>

            <h3>${review.name}</h3>

            <p>
                “${review.text}”
            </p>

            <span class="review-date">
                ${review.date}
            </span>

        </div>
    `;

    container.insertAdjacentHTML(
        'beforeend',
        cardHtml
    );
}

// --- ЗАВАНТАЖЕННЯ ---
window.addEventListener(
    'DOMContentLoaded',
    async () => {

        renderMoodHistory();

        // VIDEOS
        const videosSnapshot =
            await getDocs(
                collection(db, "videos")
            );

        videosSnapshot.forEach(doc => {
            appendVideoCard(doc.data());
        });

        // REVIEWS
        const reviewsSnapshot =
            await getDocs(
                collection(db, "reviews")
            );

        reviewsSnapshot.forEach(doc => {
            appendReviewCard(doc.data());
        });

    }
);

</script>
