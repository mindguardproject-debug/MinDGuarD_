<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindGuard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: Poppins; margin:0; background:#f5f7ff; }
header, section { padding:20px; }

.card { background:white; padding:15px; margin:10px 0; border-radius:15px; }

.btn {
    background:#7c9cff;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
}
.video-box iframe {
    width:100%;
    height:200px;
}
</style>
</head>

<body>

<header>
<h2>MindGuard</h2>
</header>

<!-- ================= VIDEOS ================= -->
<section>
<h2>Відео</h2>

<button class="btn" onclick="toggle('videoForm')">Додати відео</button>

<div id="videoForm" style="display:none">
<input id="vUrl" placeholder="YouTube URL">
<input id="vTitle" placeholder="Назва">
<textarea id="vDesc" placeholder="Опис"></textarea>
<button class="btn" onclick="addVideo()">Додати</button>
</div>

<div id="videos"></div>
</section>

<!-- ================= REVIEWS ================= -->
<section>
<h2>Відгуки</h2>

<button class="btn" onclick="toggle('reviewForm')">Залишити відгук</button>

<div id="reviewForm" style="display:none">
<input id="rName" placeholder="Ім'я">
<textarea id="rText" placeholder="Відгук"></textarea>
<button class="btn" onclick="addReview()">Надіслати</button>
</div>

<div id="reviews"></div>
</section>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// 🔥 ВСТАВ СЮДИ СВІЙ FIREBASE CONFIG
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


// ================= UI TOGGLE =================
window.toggle = (id) => {
document.getElementById(id).style.display =
document.getElementById(id).style.display === "block"
? "none"
: "block";
};


// ================= ADD VIDEO =================
window.addVideo = async () => {
const url = document.getElementById("vUrl").value;
const title = document.getElementById("vTitle").value;
const desc = document.getElementById("vDesc").value;

const id = url.split("v=")[1] || url.split("/").pop();

await addDoc(collection(db, "videos"), {
embed: `https://www.youtube.com/embed/${id}`,
title,
desc,
time: Date.now()
});

document.getElementById("vUrl").value = "";
document.getElementById("vTitle").value = "";
document.getElementById("vDesc").value = "";
};


// ================= ADD REVIEW =================
window.addReview = async () => {
const name = document.getElementById("rName").value;
const text = document.getElementById("rText").value;

await addDoc(collection(db, "reviews"), {
name,
text,
time: Date.now()
});

document.getElementById("rName").value = "";
document.getElementById("rText").value = "";
};


// ================= REALTIME VIDEOS =================
const vQuery = query(collection(db, "videos"), orderBy("time", "desc"));

onSnapshot(vQuery, (snap) => {
const box = document.getElementById("videos");
box.innerHTML = "";

snap.forEach(doc => {
const v = doc.data();

box.innerHTML += `
<div class="card">
<div class="video-box">
<iframe src="${v.embed}"></iframe>
</div>
<h3>${v.title}</h3>
<p>${v.desc}</p>
</div>
`;
});
});


// ================= REALTIME REVIEWS =================
const rQuery = query(collection(db, "reviews"), orderBy("time", "desc"));

onSnapshot(rQuery, (snap) => {
const box = document.getElementById("reviews");
box.innerHTML = "";

snap.forEach(doc => {
const r = doc.data();

box.innerHTML += `
<div class="card">
<h3>${r.name}</h3>
<p>${r.text}</p>
</div>
`;
});
});

</script>

</body>
</html>
